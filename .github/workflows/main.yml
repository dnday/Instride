name: CI/CD - Instride

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Satu deploy Pages dalam satu waktu; deploy yang sedang jalan tidak dibatalkan
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      # RLS, k-anonymity, trigger signup & agregasi diuji terhadap semua migration
      - name: Run Tests
        run: npm run test:run

      - name: Build app
        run: npm run build
        env:
          BASE_PATH: /Instride/app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      # Halaman kelompok (docs/) tetap di root Pages, app di /app
      - name: Build docs page
        if: github.event_name != 'pull_request'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Gabungkan docs + app
        if: github.event_name != 'pull_request'
        run: sudo cp -r out _site/app

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./_site

  migrate:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest

      # Dilewati sampai secret Supabase diisi
      - name: Push migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --remote --yes

      # Analisis sentimen: model sendiri via Hugging Face Space (SENTIMENT_URL + SENTIMENT_KEY),
      # atau HF Inference (HF_TOKEN), atau fallback kamus kata bila keduanya kosong.
      - name: Deploy Edge Functions (analyze-sentiment, delete-account)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # Gagal deploy function tidak boleh menahan rilis halaman; app tetap jalan (sentimen tampil "Menunggu analisis")
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          SENTIMENT_URL: ${{ vars.SENTIMENT_URL }}
          SENTIMENT_KEY: ${{ secrets.SENTIMENT_KEY }}
        run: |
          if [ -n "$SENTIMENT_URL" ] && [ -n "$SENTIMENT_KEY" ]; then
            supabase secrets set SENTIMENT_URL="$SENTIMENT_URL" SENTIMENT_KEY="$SENTIMENT_KEY" --project-ref "$SUPABASE_PROJECT_REF" --yes
          fi
          if [ -n "$HF_TOKEN" ]; then supabase secrets set HF_TOKEN="$HF_TOKEN" --project-ref "$SUPABASE_PROJECT_REF" --yes; fi
          if [ -n "$HF_MODEL" ]; then supabase secrets set HF_MODEL="$HF_MODEL" --project-ref "$SUPABASE_PROJECT_REF" --yes; fi
          supabase functions deploy analyze-sentiment --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
          supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
          supabase functions deploy seed-demo --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
